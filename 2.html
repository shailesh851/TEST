<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<body>
    <h1 id="hii">TEstinG</h1>
    <button type="btn" value="inc" onclick="incdec(this)">inc</button>
    <button type="btn" value="dec" onclick="incdec(this)">dec</button>
    <script>
        size=32
        function incdec(e){
            if(e.value=="inc"){
                cominc(size)
            }
            else{
                comdec(size)
            }
        }

        function final(aa){
            document.getElementById("hii").style.fontSize=aa+"px"
        }

        function cominc(a){
            
            setInterval(()=>{
                final(++a)
            })
        }

        function comdec(a){
            
            setInterval(()=>{
                final(--a)
            })
        }
        
        
    </script>
</body>
</html>
